; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
build_flags = 
	-DCORE_DEBUG_LEVEL=3
	-DUSE_GFX_LITE=1
; Dependencies are pinned to exact commits for reproducible builds.
lib_deps_external  = 
	tanakamasayuki/I2C BM8563 RTC@^1.0.4
	thomasfredericks/Bounce2@^2.72
	https://github.com/mrcodetastic/GFX_Lite#083ab406db5e084b87db50254f8bc0f2fe5123f3
	https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA#4ffd6f0e446cec0711b1dbb203e0edf461963ff7

[env:huidu_hd_wf1]
platform = https://github.com/Jason2866/platform-espressif32.git#66389b3fdfbdc29716b8cddfd80cbf11315af82c
board = esp32-s2-saola-1
board_build.mcu = esp32s2
framework = arduino
monitor_speed = 115200
build_flags = 
	${common.build_flags}
	-DWF1=1
lib_deps = 
	${common.lib_deps_external}

[env:huidu_hd_wf2]
platform = https://github.com/Jason2866/platform-espressif32.git#66389b3fdfbdc29716b8cddfd80cbf11315af82c
; Matches the board definition recommended in the README.
board = wifiduino32s3
framework = arduino
monitor_speed = 115200
build_flags = ${common.build_flags}
	-DWF2=1
lib_deps = ${common.lib_deps_external}
